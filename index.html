```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Live Score</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: white;
}

/* MAIN SCOREBOARD */

.scoreboard {
    width: 1000px;
    min-height: 190px;
    margin: 40px auto;

    background:
        linear-gradient(135deg,
        rgba(10, 20, 60, 0.97),
        rgba(25, 5, 70, 0.96));

    border-radius: 22px;

    border: 2px solid rgba(255,255,255,0.18);

    box-shadow:
        0 15px 45px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(255,255,255,0.04);

    overflow: hidden;
}

/* TOP BAR */

.topbar {
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background:
        linear-gradient(90deg,
        #ff3b30,
        #ff9500,
        #ffcc00);

    font-weight: bold;
}

.live {
    display: flex;
    align-items: center;
    gap: 8px;
}

.live-dot {
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.25;
    }
}

.match-title {
    font-size: 16px;
    letter-spacing: 1px;
}

/* SCORE AREA */

.main {
    display: grid;
    grid-template-columns: 230px 1fr 230px;

    min-height: 145px;
    align-items: center;

    padding: 15px 25px;
}

/* TEAM */

.team {
    text-align: center;
}

.team-name {
    font-size: 23px;
    font-weight: 800;
}

.team-flag {
    font-size: 38px;
    margin-bottom: 4px;
}

/* SCORE */

.score {
    text-align: center;
}

.runs {
    font-size: 58px;
    line-height: 1;

    font-weight: 900;

    background:
        linear-gradient(90deg,#00e5ff,#ffffff,#ffea00);

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.overs {
    margin-top: 7px;

    font-size: 17px;
    color: #d7dcff;
}

/* PLAYER */

.players {
    border-left: 1px solid rgba(255,255,255,0.18);
    padding-left: 22px;
}

.player {
    display: flex;
    justify-content: space-between;

    margin: 7px 0;

    font-size: 16px;
}

.player strong {
    color: #00e5ff;
}

/* BOTTOM */

.bottom {
    display: flex;
    justify-content: center;
    gap: 35px;

    padding: 9px 15px;

    background: rgba(0,0,0,0.25);

    font-size: 14px;
}

.stat {
    color: #cfd5ff;
}

.stat strong {
    color: white;
}

/* BALLS */

.balls {
    display: flex;
    gap: 6px;
    justify-content: center;
}

.ball {
    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 12px;
    font-weight: bold;

    background: #3a416d;
}

.ball.four {
    background: #00aaff;
}

.ball.six {
    background: #9b30ff;
}

.ball.wicket {
    background: #ff304f;
}

.ball.dot {
    background: #555b7d;
}
</style>
</head>

<body>

<div class="scoreboard">

    <!-- TOP -->

    <div class="topbar">

        <div class="live">
            <span class="live-dot"></span>
            LIVE
        </div>

        <div class="match-title">
            🏏 INTERNATIONAL CRICKET
        </div>

        <div>
            T20
        </div>

    </div>


    <!-- MAIN -->

    <div class="main">

        <!-- TEAM -->

        <div class="team">

            <div class="team-flag">
                🇮🇳
            </div>

            <div class="team-name">
                INDIA
            </div>

        </div>


        <!-- SCORE -->

        <div class="score">

            <div class="runs">
                187/4
            </div>

            <div class="overs">
                18.2 OVERS
            </div>

        </div>


        <!-- PLAYERS -->

        <div class="players">

            <div class="player">
                <span>Virat Kohli *</span>
                <strong>72 (45)</strong>
            </div>

            <div class="player">
                <span>Ravindra Jadeja</span>
                <strong>18 (11)</strong>
            </div>

            <div class="player">
                <span>Bowler: Starc</span>
                <strong>1/32</strong>
            </div>

        </div>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <div class="stat">
            CRR <strong>10.20</strong>
        </div>

        <div class="stat">
            RRR <strong>8.45</strong>
        </div>

        <div class="stat">
            PARTNERSHIP <strong>42</strong>
        </div>

        <div class="balls">

            <div class="ball dot">1</div>
            <div class="ball four">4</div>
            <div class="ball dot">0</div>
            <div class="ball six">6</div>
            <div class="ball wicket">W</div>
            <div class="ball dot">2</div>

        </div>

    </div>

</div>

</body>
</html>
```
